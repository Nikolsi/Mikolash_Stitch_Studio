name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only what the web pages need)
        run: |
          set -e
          V=animation/studio_animation_layers_v3
          mkdir -p _site/$V
          cp index.html _site/
          cp -R concept-mockup _site/
          for d in 01_scene_layers 02_character_frames 03_ambient_overlays 04_guides 06_web_preview 09_dog content; do
            cp -R "$V/$d" "_site/$V/"
          done
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
